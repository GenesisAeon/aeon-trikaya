name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build
      - name: Build wheel and sdist
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with dev extras
        run: pip install -e ".[dev,plotting,flask]"
      - name: Run tests
        run: pytest

  publish-pypi:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Repository secret: Settings -> Secrets -> Actions -> PYPITOKEN
          # (plain API-token upload, not Trusted Publishing -- several
          # other GenesisAeon packages hit `invalid-publisher` failures
          # with the `environment: pypi` / OIDC approach because the
          # publisher was never registered at pypi.org; this simpler,
          # already-proven-reliable pattern avoids that failure mode.)
          password: ${{ secrets.PYPITOKEN }}

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
      # NOTE: Zenodo archival of this GitHub Release happens automatically
      # IF this repo has Zenodo-GitHub integration enabled at
      # https://zenodo.org/account/settings/github/ (a per-repo, per-owner
      # OAuth toggle on zenodo.org -- cannot be set from a workflow file).
      # Once enabled, every GitHub Release like this one mints/updates a
      # Zenodo DOI automatically using the .zenodo.json metadata in this repo.
