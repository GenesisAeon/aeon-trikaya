[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeon-trikaya"
version = "0.1.1"
description = "Fractal CREP feedback and Trikaya state classification for numeric-to-symbolic sensemaking (GenesisAeon P52)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Römer, Johann", email = "joberoemer@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "trikaya",
    "CREP",
    "UTAC",
    "GenesisAeon",
    "fractal-feedback",
    "symbolic-ai",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "diamond-setup>=2.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plotting = ["plotly>=5.18.0"]
flask = ["flask>=3.0"]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/GenesisAeon/aeon-trikaya"
Repository = "https://github.com/GenesisAeon/aeon-trikaya"
Issues = "https://github.com/GenesisAeon/aeon-trikaya/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aeon_trikaya"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=aeon_trikaya --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
ignore_missing_imports = true
